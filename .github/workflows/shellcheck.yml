name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Syntax and lint (installer)
        run: |
          bash -n tg-webproxy.sh
          shellcheck -s bash -S warning tg-webproxy.sh

      - name: Syntax and lint (embedded tgwebproxy CLI)
        run: |
          sed -n "/^\tcat > \"\$MGMT.tmp\" <<'UTILITY_EOF'$/,/^UTILITY_EOF$/p" tg-webproxy.sh | sed '1d;$d' > cli.sh
          test -s cli.sh
          bash -n cli.sh
          shellcheck -s bash -S warning cli.sh

      - name: Version constant present in the first 4 KB
        run: head -c 4096 tg-webproxy.sh | grep -qE '^TGWP_VERSION="[0-9]+\.[0-9]+\.[0-9]+"'
